name: Sync Upstream Modules

on:
  schedule:
    # 每 6 小时同步一次 (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-modules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Test sync safeguards
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Start Script-Hub converter
        run: |
          git clone --depth 1 https://github.com/Script-Hub-Org/Script-Hub.git /tmp/script-hub
          cd /tmp/script-hub
          npm install --ignore-scripts --no-audit --no-fund
          HOST=127.0.0.1 nohup node service.js > /tmp/script-hub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9100/ ; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/script-hub.log
          exit 1

      - name: Sync modules
        run: python scripts/sync.py

      - name: Commit and push changes
        run: |
          git add -A modules scripts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream modules $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
