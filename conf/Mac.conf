# ============================================================
# Shadowrocket 专业全能配置 · Claude 版（v3.3 · macOS 15 精简版）
# 生成日期：2026-07-09 · 修订：2026-09-08（新增 Trae 国内域名 trae.cn/trae.com.cn/trae.guru 强制直连，置于 AI 规则集之前，修复 trae.cn 被 AI 分流走代理导致 CDN 403）；2026-09-10（下线 WireGuard 内网隧道/阿里云 wloc-gw 中继，10/8 回归 TUN 排除，Tailscale 仅走内置模块/系统 utun）；2026-09-22（新增国内 AI 域名强制直连白名单；反劫持区新增 AWAvenue；内联小型规则集并将停更媒体表迁移至 Repcz/Tool）
#
# 设计目标：
#   1) 国内外智能分流（白名单：国内直连，其余走代理）
#   2) 去广告 + 反运营商劫持（REJECT，无需装证书 / 不解密 HTTPS）
#   3) Claude / OpenAI 等 AI 默认走 PROXY（可选手动切地区）；Mac 仅轻量 Apple 智能解锁
#   4) iCloud / App Store / Apple Music / APNs 等日常 Apple 服务直连，不卡顿
#   5) 流媒体 / 社交 / 开发 / 游戏 / 国内服务全覆盖，按地区分组可选
#   6) 使用 Shadowrocket 内置 Tailscale 模块：官方 App 关闭；模块处理 100.x / MagicDNS
#
# 已融合另两份配置(ultimate_v2 / pro_universal)的优点：
#   · 局域网与私有 IP 置顶直连；AUTO 测速组排除「流量/到期」等订阅信息项
#   · 流媒体/社交/开发/国内服务大幅扩展；域名级国内 DNS 提示
#   · Apple News / TV+ 单独走代理解锁，但 Apple Music/iCloud 仍直连
#   · apps.mzstatic.com 与 iCloud 全系默认直连（含 gateway.icloud.com）
#
# macOS 15 适配说明：
#   · 舍弃 skip-proxy 中的 iOS 银行/资讯 App 专属条目（ccb/abchina/psbc/baidu/163）
#   · APNs 推送直连用真实域名 push.apple.com（非 push-apple.com）
#   · tun-excluded-routes 含 AWDL 链路本地段(169.254/16)与组播(224/4)
#   · Mac 轻量「苹果智能」：仅核心 guzzoni/smoot/apple-relay 域名，默认美国节点
#   · AI 组默认 PROXY（不锁死美国），需要时再选手动切地区节点
#   · Tailscale：不从 TUN/skip-proxy 排除 100.64/10 与 *.ts.net；
#     规则 DIRECT + fake-ip 过滤 + Host 指向 100.100.100.100；官方 App 与 SR 模块二选一
#
# 规则源（2026-09-22 在线核验；活跃度见各区注释）：
#   · QuixoticHeart/rule-set        综合 AI 分流（每日自动更新）
#   · VPSDance/ai-proxy-rules       AI 分流（含 OpenAI/Anthropic 的 IP-ASN/IP-CIDR 网络级规则）
#   · blackmatrix7/ios_rule_script  分流/反劫持规则（聚合表活跃；部分单服务表已停更）
#   · Repcz/Tool                    单服务流媒体规则（X 分支，自动构建）
#   · 去广告改用模块：bilibili（自维护 SR 兼容版，替代已退役的 BiliUniverse ADBlock）/ deezertidal AdBlock·startingad·YouTubeAd（见模块清单）
#
# 使用：首页添加节点订阅 → 本配置设为「配置文件」并应用 → 全局路由选「配置」。
#       更新规则前先选一个可用节点、全局路由设「代理」，否则可能拉不到 GitHub 规则。
#       节点名需含地区关键词（香港/HK/🇭🇰、美国/US/🇺🇸 等）才能被地区分组识别。
# ============================================================

[General]
bypass-system = true
# skip-proxy：真局域网 + 本地解析 + captive + APNs 推送直连
# （已舍弃 iOS 银行/资讯 App 专属条目 ccb/abchina/psbc/baidu/163，Mac 浏览器由规则区 DIRECT 覆盖）
# APNs 真实域名为 *.push.apple.com（日志常见 N-courier.push.apple.com:5223），不是 push-apple.com
# Tailscale 不加入 skip-proxy：进入 Shadowrocket TUN，由 Tailscale 隧道规则处理
skip-proxy = 192.168.0.0/16,172.16.0.0/12,localhost,*.local,*.lan,*.internal,captive.apple.com,e.crashlytics.com,*.push.apple.com,*.push-apple.com.cn,*.apns.apple.com
# TUN 排除：真局域网(含 RFC1918 10/8) / 链路本地 / 组播；不含 100.64/10（否则被 Wi-Fi 网关抢走超时）
# 内网隧道已下线：10.0.0.0/8 重新加回排除列表，10.x 私有地址由系统直接路由，不再进 TUN
# 100.64/10 进 TUN → Tailscale 隧道规则 → TAILSCALE 模块或官方 Tailscale utun；fd7a::/48 同理
tun-excluded-routes = 127.0.0.0/8,10.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32,::1/128,fc00::/7,fe80::/10,ff00::/8
# DNS：国内加密 DNS 优先，解析快抗污染
# fake-ip：浏览器拿到 198.18.x.x 假 IP，请求一发出即被 Shadowrocket 拦截按规则路由，
# 由代理节点用本地 DNS 重新解析，彻底绕开国内 DoH 对 Google/AI 域名的污染，
# 解决 Gemini/Claude 网页"每次刷新一次才打开"的冷启动卡顿
dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query,223.5.5.5,119.29.29.29
fallback-dns-server = system
always-fake-ip = true
# *.ts.net 必须过滤：否则 MagicDNS 主机名会被发成 198.18 假 IP，Tailscale 设备名解析失败
fake-ip-filter = *.lan, *.local, *.internal, *.ts.net, *.push.apple.com, *.apns.apple.com, captive.apple.com, e.crashlytics.com
# IPv6：默认关闭，避免 AAAA 经代理超时/泄漏导致卡顿（IPv6-only 网络可改 true）
ipv6 = false
prefer-ipv6 = false
# 直连域名用系统 DNS：让国内 CDN 拿到本地运营商解析，就近选节点更快
dns-direct-system = true
dns-direct-fallback-proxy = true
private-ip-answer = true
icmp-auto-reply = true
always-reject-url-rewrite = false
# 劫持硬编码 DNS 的应用（Netflix/Disney 等），交回本配置 DNS，保证分流/解锁生效
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53
udp-policy-not-supported-behaviour = REJECT
# 仅对走代理的连接屏蔽 QUIC/HTTP3，回退 TCP 更稳；国内直连 QUIC 不受影响
block-quic = all-proxy
use-local-host-item-for-proxy = false

[Proxy]
# 留空：节点来自你的订阅；下方分组用 policy-regex-filter 按节点名自动归类

[Proxy Group]
# —— 自动测速（排除「流量/到期/官网」等订阅信息项，避免把信息页当成节点测速）——
自动选择 = url-test,policy-regex-filter=^((?!(剩余|流量|套餐|官网|重置|到期|过期|Expire|Traffic|网址)).)*$,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5

# —— 地区节点池：按节点名关键词自动归类、测速选最快 ——
香港节点 = url-test,policy-regex-filter=🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
台湾节点 = url-test,policy-regex-filter=🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
日本节点 = url-test,policy-regex-filter=🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
新加坡节点 = url-test,policy-regex-filter=🇸🇬|SG|Sing|sing|Singapore|singapore|新加坡|狮城|沪新|京新|深新|杭新|广新,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
韩国节点 = url-test,policy-regex-filter=🇰🇷|KR|Korea|korea|KOR|韩国|首尔|韩|韓|春川,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
# 去掉裸字「美」，避免「港美/中美/美西中转」等误入美国池
美国节点 = url-test,policy-regex-filter=🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|圣何塞|达拉斯,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5

# —— Apple 日常服务：默认直连，保证 iCloud/App Store/Apple Music 不卡 ——
苹果服务 = select,DIRECT,PROXY,自动选择,香港节点,日本节点,美国节点,policy-select-name=DIRECT

# —— Apple 智能（Mac 轻量版）：仅核心 PCC/Siri 域名，默认美国；iCloud 等仍走苹果服务直连 ——
