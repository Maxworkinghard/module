# —— AI 服务：默认 PROXY；需要固定出口时再选手动切美国/日本等 ——
AI = select,PROXY,自动选择,美国节点,日本节点,新加坡节点,香港节点,policy-select-name=PROXY

# —— Tailscale 通道：Mac 运行官方 Tailscale App，默认 DIRECT 由系统 utun 直连（若改用 SR 内置模块可手选）——
Tailscale通道 = select,DIRECT,policy-select-name=DIRECT

