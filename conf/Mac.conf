[Rule]
# ============ 0. Tailscale 隧道网段（必须置于 Lan.list 之前：Lan.list 含 100.64/10、ts.net，会先命中 DIRECT 截走隧道流量）============
IP-CIDR,100.64.0.0/10,Tailscale通道,no-resolve
# Tailscale IPv6 ULA
IP-CIDR6,fd7a:115c:a1e0::/48,Tailscale通道,no-resolve
# MagicDNS 主机名（machine-name.tailnet-name.ts.net）
DOMAIN-SUFFIX,ts.net,Tailscale通道
# ============ 0.5 局域网 / 私有地址：置顶直连，避免误代理 ============
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
# Tailscale 管理面/登录页走代理（便于跨区访问），不影响 100.x 互通
DOMAIN-SUFFIX,tailscale.com,PROXY
DOMAIN-SUFFIX,tailscale.io,PROXY

# ============ 0.5 macOS 系统服务（APNs 推送 / 接力 / 随航 / 通用剪贴板，直连保稳）============
# Apple Push Notification：iMessage、接力(Handoff)、随航(Sidecar)、通用剪贴板均依赖 APNs。
# 真实主机为 *.push.apple.com:5223（如 0-courier.push.apple.com）；push-apple.com 是错误拼写，不会命中。
# 直连更稳，避免代理 IP 变动导致推送掉线。
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SUFFIX,push-apple.com.cn,DIRECT
DOMAIN-SUFFIX,apns.apple.com,DIRECT
# Apple 官方网段兜底（无域名的 17.x 连接走苹果服务=默认直连）
IP-CIDR,17.0.0.0/8,苹果服务,no-resolve

