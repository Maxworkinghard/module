# 通用合集不重复处理由本仓库专用模块负责的 App。
# 使用域名/脚本中的关键词，兼容 api\.(bilibili|biliapi) 等组合正则。
filters:
  dedicated_apps:
    desc: "B站、小红书、知乎、YouTube、彩云及微信外链使用对应专用模块"
    patterns:
      - "bilibili|biliapi|hdslb|bilivideo"
      - "xiaohongshu|redbook"
      - "zhihu"
      - "youtube|googlevideo|ytimg"
      - "cyapi|caiyunapp|caiyuntianqi|colorfulclouds"
      - 'weixin110|support\.weixin\.qq\.com|UnblockURLinWeChat'
  bilibili_optional_features:
    desc: "不改动账户会员字段和整套导航布局，仅保留广告接口处理"
    patterns:
      - 'account/(mine|myinfo)'
      - 'x/resource/show/tab/v2'

modules:
  # 作者当前网站版本，替代 bai1zi 的旧快照；保留 Adblock 原订阅地址。
  - name: Adblock
    desc: "APP 开屏去广告 (yfamilys / ddgksf2013 / deezertidal)"
    url: "https://yfamilys.com/module/startingad.module"
    display_name: "Adblock · 开屏去广告"
    module_desc: "通用开屏去广告；B站、小红书、知乎、YouTube、彩云及微信外链请单独启用对应模块"
    filter: dedicated_apps

  # QX 重写由工作流内 Script-Hub 服务转换。与 Adblock 二选一。
  - name: rewrite
    desc: "广告拦截合集-重写 (fmz200/wool_scripts)"
    url: "http://127.0.0.1:9100/file/_start_/https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/rewrite.snippet/_end_/rewrite.sgmodule?type=qx-rewrite&target=shadowrocket-module&del=true&jqEnabled=true"
    filter: dedicated_apps

  - name: cleanup
    desc: "App 与小程序净化合集 (fmz200/wool_scripts)"
    url: "http://127.0.0.1:9100/file/_start_/https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/cleanup.snippet/_end_/cleanup.sgmodule?type=qx-rewrite&target=shadowrocket-module&del=true&jqEnabled=true"
    filter: dedicated_apps

  # fmz200 原生 Shadowrocket 模块，使用 kokoryh 当前 Sparkle 脚本。
  # 当前脚本接受 JSON 参数，覆盖上游旧的数组模板，保留最常访问列表。
  - name: bilibili
    url: "https://raw.githubusercontent.com/fmz200/wool_scripts/main/Shadowrocket/module/split/partB/bilibili.srmodule"
    display_name: "BiliBili · 去广告"
    module_desc: "fmz200 / kokoryh 当前广告接口处理；已固定 JSON 参数，关闭赞助片段跳过"
    filter: bilibili_optional_features
    script_arguments:
      bilibili.airborne:
        logLevel: "error"
        sponsorBlock: false
      bilibili.request:
        logLevel: "error"
        purifyComment: true
        sponsorBlock: false
      bilibili.live:
        logLevel: "error"
      bilibili.protobuf:
        logLevel: "error"
        displayUpList: "show"
        purifyComment: true
        sponsorBlock: false

# 停用模块保留同名提示文件，让已经导入旧地址的客户端在刷新后移除旧规则。
retired_modules:
  - name: FuckAppsAD
    reason: "旧合集包含多处失效脚本，已移除原规则"
    replacement: Adblock
  - name: RevenueCat
    reason: "原作者脚本已返回 404，停止分发旧缓存"
retired_scripts:
  - Revenuecat.js
  - bilibili-json.js
  - bilibili-proto.js

# 脚本必须可下载且不是 HTML；失败会中止本次发布，而非假装同步成功。
